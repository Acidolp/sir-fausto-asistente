<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Asistente Sir Fausto LP</title>
<style>
body{margin:0;background:#f4f7f5;font-family:Arial,sans-serif;color:#17221d}
.app{max-width:760px;margin:auto;height:100vh;display:flex;flex-direction:column;background:white}
header{padding:22px;background:#183c2b;color:white}
header h1{margin:0 0 5px;font-size:22px} header p{margin:0;opacity:.85}
#chat{flex:1;overflow:auto;padding:18px}
.msg{max-width:82%;padding:12px 14px;border-radius:16px;margin:9px 0;line-height:1.4;white-space:pre-wrap}
.bot{background:#edf2ee}.user{background:#183c2b;color:white;margin-left:auto}
form{display:flex;gap:8px;padding:12px;border-top:1px solid #ddd}
input{flex:1;padding:13px;border:1px solid #ccd5cf;border-radius:12px;font-size:16px}
button{border:0;border-radius:12px;padding:0 18px;background:#183c2b;color:white;font-weight:bold}
a{color:inherit}
</style></head>
<body><div class="app">
<header><h1>Sir Fausto LP</h1><p>Asistente de productos</p></header>
<div id="chat"></div>
<form id="form"><input id="input" autocomplete="off" placeholder="Escribí tu consulta..." autofocus><button>Enviar</button></form>
</div>
<script>
const chat=document.getElementById("chat"), form=document.getElementById("form"), input=document.getElementById("input");
let messages=[];
function add(text,who){const d=document.createElement("div");d.className="msg "+who;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
add("👋 ¡Hola! Soy el asistente de Sir Fausto LP. ¿Qué estás buscando? Puedo ayudarte con barba, cabello, rostro y cuidado personal.","bot");
form.addEventListener("submit",async e=>{
 e.preventDefault(); const text=input.value.trim(); if(!text)return;
 add(text,"user"); messages.push({role:"user",content:text}); input.value="";
 add("Escribiendo…","bot"); const loading=chat.lastChild;
 try{
  const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages})});
  const j=await r.json(); loading.remove();
  if(!r.ok) throw new Error(j.error||"Error");
  add(j.reply,"bot"); messages.push({role:"assistant",content:j.reply});
 }catch(err){loading.remove();add("No pude responder en este momento. Revisá que el asistente esté conectado y que la API esté configurada.","bot")}
});
</script></body></html>
